# Astana apartment-sale Cleaner. The first deployment ingests Collector data
# without submitting historical listings to paid OpenAI Batch jobs.
services:
  - type: web
    name: rieltor-sales-cleaner-astana
    runtime: docker
    region: frankfurt
    plan: standard
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: rieltor-sales-cleaner-astana-data
      mountPath: /app/data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: PORT
        value: "8002"
      - key: COLLECTOR_URL
        value: https://rieltor-collector-pokupka-v2.onrender.com
      - key: COLLECTOR_API_KEY
        sync: false
      - key: COLLECTOR_CANDIDATE_SCOPE
        value: astana_sale_pilot_v1
      - key: CLEANER_API_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: REASONING_EFFORT
        value: medium
      # No historical paid Batch submissions during the first deployment.
      - key: MIN_BATCH_SIZE
        value: "999999"
      - key: MAX_BATCHES_PER_CYCLE
        value: "1"
      - key: PILOT_LIMIT
        value: "100"
      - key: CLEANER_CYCLE_INTERVAL_H
        value: "12"
      - key: CLEANER_INGEST_TICK_S
        value: "300"
      - key: CLEANER_FULL_RETRY_S
        value: "900"
      - key: MAINRIELTOR_PHOTO_SYNC_ENABLED
        value: "1"
      - key: MAINRIELTOR_URL
        value: https://pokupka-rieltor-main.onrender.com
      - key: LOG_LEVEL
        value: INFO
